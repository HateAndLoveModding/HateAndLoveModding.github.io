<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>projects | ryker@mines:~$</title>
  <meta name="description" content="Projects by Ryker Phelps: shipped, in progress, and write-up-only work, from Minecraft mods to a RAG pipeline.">
  <script>
    try {
      var t = localStorage.getItem('ryker-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <link rel="stylesheet" href="css/gruvbox.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header>
    <div class="header-inner">
      <a class="brand" href="index.html">ryker@mines:~$</a>
      <nav aria-label="Main">
        <ul>
          <li><a href="index.html">home</a></li>
          <li><a href="projects.html" aria-current="page">projects</a></li>
          <li><a href="blog.html">blog</a></li>
          <li><a href="uses.html">uses</a></li>
          <li><a href="contact.html">contact</a></li>
        </ul>
      </nav>
      <button id="theme-toggle" type="button" aria-label="Switch to light theme">dark mode</button>
      <button id="terminal-launch" type="button" aria-label="Open terminal mode">terminal</button>
    </div>
  </header>

  <main id="main">
    <h1>projects</h1>
    <p>Everything shipped, in progress, or write-up only. Newest first.</p>
    <section aria-labelledby="project-list-heading">
      <h2 id="project-list-heading" class="cmd">projects.txt</h2>
      <div id="project-list">
        <p>Loading projects&hellip;</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 Ryker Phelps. <a href="https://github.com/HateAndLoveModding/HateAndLoveModding.github.io">Site source</a>.</p>
      <p>Gruvbox theme, dark by default; the toggle above remembers your choice.</p>
    </div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/vendor/marked.js"></script>
  <script src="js/content.js"></script>
  <script src="js/pages.js"></script>
  <script>
    (function () {
      'use strict';
      var container = document.getElementById('project-list');
      Content.loadIndex().then(function (items) {
        var projects = Content.sortByDate(items.filter(function (item) {
          return item.kind === 'project';
        }));
        Pages.renderCardList(container, projects, function (item) {
          return 'project.html?slug=' + encodeURIComponent(item.slug);
        });
      }).catch(function (err) {
        Content.renderFetchError(container, err);
      });
    })();
  </script>
</body>
</html>
